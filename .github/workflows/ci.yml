# CI: validates every change before it can be merged (CLAUDE.md "CI Pipeline", SPRINTS ROO-13).
# Steps: install (cached) → dependency audit → format check → lint → typecheck → test (with Postgres) → build.
name: CI

on:
  # Lets deploy.yml re-run the same checks on the exact commit it is about to deploy.
  workflow_call:
  push:
    branches: ['feature/**', 'fix/**', 'hotfix/**']
  pull_request:
    branches: [dev, main]

# A newer push to the same branch/PR cancels the older, now-irrelevant run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # Throwaway database for the API integration tests. CI-only credentials.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: roopaank
          POSTGRES_PASSWORD: roopaank
          POSTGRES_DB: roopaank_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roopaank -d roopaank_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Database name must end with "_test" (guard in apps/api/tests/test-database.ts).
      TEST_DATABASE_URL: postgresql://roopaank:roopaank@localhost:5432/roopaank_test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` installs exactly what package-lock.json says and fails if it is out of sync.
      - name: Install dependencies
        run: npm ci

      # Fails on any new high/critical advisory; known ones are allowlisted with a reason (ROO-16).
      - name: Dependency audit
        run: npm run audit:deps

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
