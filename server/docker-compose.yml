services:
  db:
    image: postgres:16
    container_name: roopaank-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: roopaank
    ports:
      - "5433:5432"
    volumes:
      - roopaank-pgdata:/var/lib/postgresql/data

volumes:
  roopaank-pgdata:
