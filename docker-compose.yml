# Local development services. Credentials here are for the local Docker
# database only — never reuse them in staging or production.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: roopaank
      POSTGRES_PASSWORD: roopaank
      POSTGRES_DB: roopaank
    ports:
      # 5434 on the host avoids clashing with a locally installed Postgres (5432).
      - "${DB_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on first start: creates the separate test database.
      - ./scripts/db/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roopaank -d roopaank"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
